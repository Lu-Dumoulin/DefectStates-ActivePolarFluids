name = "DefectStatesActivePolarFluids"

# Environment for the simulation, sweep-generation and figure scripts.
#
# No Manifest.toml is shipped on purpose: the paper runs used CUDA on Linux
# (Baobab, UNIGE), and a Manifest resolved on any other platform would pin the
# wrong binary artifacts. Versions actually used are recorded in the README.
#
# Makie appears only because the vendored Utilities/JulUtils.jl carries a
# `screensize()` helper that needs it. Nothing in this repository calls it.
#
# Analysis/PhaseDiagram.jl additionally wants LsqFit, GaussianMixtures,
# ShiftedArrays and ImageView. They are left out on purpose: ImageView needs a
# GUI toolkit and fails on a headless machine. Utilities/using.jl installs them
# on demand if you run that script.

