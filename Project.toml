name = "DefectStatesActivePolarFluids"

# Environment for the simulation, sweep-generation and figure scripts.
#
# No Manifest.toml is shipped on purpose: the paper runs used CUDA on Linux,
# and a Manifest resolved on any other platform would pin the wrong binary
# artifacts. Versions actually used are recorded in the README.
#
# Makie appears only because the vendored Utilities/JulUtils.jl carries a
# `screensize()` helper that needs it. Nothing in this repository calls it.
#
# LSA/linear_stability.jl needs nothing beyond base Julia.

[deps]
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
JLD = "4138dd39-2aa7-5051-a626-17a0bb65d9c8"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[compat]
julia = "1.10"
